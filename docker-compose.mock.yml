# Runs the whole stack against fake exchanges, a fake CoinGecko and a fake
# Finnhub (stocks and forex), for testing without network access or API keys:
#   POSTGRES_PASSWORD=dev docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --build
# then open http://localhost:8000
services:
  mock-feeds:
    build:
      context: .
      dockerfile: apps/prices/Dockerfile
    command: ["node", "dist/dev/mock-feeds.js"]
    environment:
      # Set to "true" to see stocks and forex trade at night and on weekends.
      MOCK_MARKETS_ALWAYS_OPEN: ${MOCK_MARKETS_ALWAYS_OPEN:-false}

  prices:
    environment:
      COINGECKO_BASE_URL: http://mock-feeds:9100/api/v3
      COINGECKO_MIN_GAP_MS: "100"
      COINBASE_REST_URL: http://mock-feeds:9100
      COINBASE_WS_URL: ws://mock-feeds:9101
      KRAKEN_WS_URL: ws://mock-feeds:9102
      FINNHUB_API_KEY: mock
      FINNHUB_BASE_URL: http://mock-feeds:9100/finnhub/api/v1
      FINNHUB_WS_URL: ws://mock-feeds:9103
      FINNHUB_CALLS_PER_MINUTE: "3000"
      FINNHUB_WS_SYMBOLS: "600"
      SITE_URL: http://localhost:8000
    depends_on:
      mock-feeds: { condition: service_started }

  web:
    environment:
      SITE_URL: http://localhost:8000

  caddy:
    ports: !override
      - "127.0.0.1:8000:80"
    environment:
      SITE_ADDRESS: ":80"
