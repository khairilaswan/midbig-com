# Runs the real site on your own computer, with live Coinbase, Kraken and
# CoinGecko data, at http://localhost:8000. See docs/run-on-your-computer.md.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  prices:
    environment:
      SITE_URL: http://localhost:8000

  web:
    environment:
      SITE_URL: http://localhost:8000

  caddy:
    # IPv4 only: on some Windows PCs Docker's IPv6 relay for localhost hangs,
    # and binding 127.0.0.1 makes browsers use the working IPv4 address.
    ports: !override
      - "127.0.0.1:8000:80"
    environment:
      SITE_ADDRESS: ":80"
